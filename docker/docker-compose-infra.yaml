# Infra-only compose for local development.
#
# Run dari direktori ini (analytics-ai-service & analytics-ui di-run lokal di terminal lain):
#   docker compose -f docker-compose-infra.yaml --env-file .env.infra up -d
#   docker compose -f docker-compose-infra.yaml --env-file .env.infra down
#
# Yang dijalankan: bootstrap (init data dir), analytics-engine, ibis-server,
# qdrant, northwind-db (optional). Service analytics-service & analytics-ui
# TIDAK dijalankan di sini -- run lokal:
#   AI service:  cd analytics-ai-service && just start  (atau uvicorn manual)
#   UI:          cd analytics-ui && yarn dev -p 13000

volumes:
  data:
  qdrant_data:
  northwind_data:

networks:
  analytics:
    driver: bridge

services:
  bootstrap:
    build:
      context: ./bootstrap
      dockerfile: Dockerfile
    restart: on-failure
    platform: linux/amd64
    environment:
      DATA_PATH: /app/data
    volumes:
      - data:/app/data
    command: /bin/sh /app/init.sh

  analytics-engine:
    image: ghcr.io/nexusquantum/analytics-engine:latest
    restart: on-failure
    platform: ${PLATFORM}
    env_file:
      - .env.infra
    ports:
      - "${ANALYTICS_ENGINE_PORT}:${ANALYTICS_ENGINE_PORT}"
    volumes:
      - data:/usr/src/app/etc
      - ${PROJECT_DIR}/data:/usr/src/app/data
    networks:
      - analytics
    depends_on:
      - bootstrap

  ibis-server:
    image: ghcr.io/nexusquantum/analytics-engine-ibis:latest
    restart: on-failure
    platform: ${PLATFORM}
    env_file:
      - .env.infra
    ports:
      - "${IBIS_SERVER_PORT}:${IBIS_SERVER_PORT}"
    volumes:
      - ${LOCAL_STORAGE:-.}:/usr/src/app/data
    networks:
      - analytics
    depends_on:
      - analytics-engine

  qdrant:
    image: qdrant/qdrant:v1.11.0
    restart: on-failure
    # Expose ke host supaya AI service yang run lokal bisa connect
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - analytics

  # Northwind PostgreSQL Demo Database -- comment kalau tidak perlu
  northwind-db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env.infra
    ports:
      - "5432:5432"
    volumes:
      - ./northwind.sql:/docker-entrypoint-initdb.d/northwind.sql:ro
      - northwind_data:/var/lib/postgresql/data
    networks:
      - analytics
